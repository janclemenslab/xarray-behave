main:
- type: text
  text: Create a DAS training dataset from audio files and their annotation CSV files.

- name: data_folder
  label: Data folder
  type: file_dir
  default: ""

- name: store_folder
  label: Dataset folder
  type: file_dir
  default: ""
  help: New folder for the train, validation, and test data. An existing folder will not be overwritten.

- name: split_by
  label: Split by
  type: list
  default: samples
  options: "samples,files"

- name: validation_fraction
  label: Validation fraction
  type: double
  default: 0.2
  decimals: 2
  range: 0,0.99

- name: test_fraction
  label: Test fraction
  type: double
  default: 0.2
  decimals: 2
  range: 0,0.99

- name: seed
  label: Random seed
  type: optional_int
  help: Used when splitting by files.
  none_label: No seed
  default_disabled: True
  default: 1
  range: 0,2147483647

- name: create
  label: Create dataset
  type: button
  default: main action
